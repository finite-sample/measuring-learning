name: R analysis and manuscript
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DP_DATA_ROOT: ${{ github.workspace }}/.deps/dp_data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: soodoku/dp_data
          ref: f88da7fa904cde55044dd3dda9fd337ca26cb8bd
          path: .deps/dp_data
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra
      - uses: r-lib/actions/setup-renv@v2
      - run: make check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manuscript
          path: ms/main.pdf
